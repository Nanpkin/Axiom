name: Check source
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  # Let a verified milestone finish packaging while newer pushes replace the pending run.
  cancel-in-progress: false
jobs:
  core:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Check source privacy
        shell: pwsh
        run: ./tools/check-source-privacy.ps1
      - name: Tests declared for this change
        shell: pwsh
        run: ./tools/test-core.ps1
      - name: Build Windows application
        shell: pwsh
        run: |
          dotnet restore Axiom.slnx --locked-mode -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build Axiom.slnx -c Release --no-restore /m:1 /nr:false
          exit $LASTEXITCODE
  private-packages:
    if: github.event_name == 'pull_request'
    needs: core
    uses: ./.github/workflows/build-release.yml
    with:
      version: '0.1.0-preview.observation'
